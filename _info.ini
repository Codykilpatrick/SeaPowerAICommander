[Language_en]
Name=AI Commander
Description=A force-level brain for the Sea Power AI.

Sea Power ships a detailed per-unit AI and no force-level AI at all: TaskForceAI.OnUpdate is called every frame for every task force and its body is empty. This mod fills that vacancy - a task force now builds a picture of the battle from its own plotting table and issues orders to its units, on top of the tactical AI the game already has.

The picture is detection-limited by construction. It is built from the task force's own contacts, not from ground truth, so the force brain reasons about what it has actually found.

Requires [u][url="https://steamcommunity.com/sharedfiles/filedetails/?id=3380210757"]Anchor Chain[/url][/u] and its preloader.

[b]Enable this mod in the mod menu, then fully restart the game.[/b] Applying a mod change only reloads the scene, so code mods cannot be loaded or unloaded until the game is closed and reopened. This applies when disabling it too.

